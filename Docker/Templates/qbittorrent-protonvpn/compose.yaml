services:
  qbittorrent:
    container_name: qBittorrent
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION:-latest}
    user: ${PUID:-0}:${PGID:-0}
    network_mode: "service:protonvpn"
    environment:
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    volumes:
      - /etc/TZ:/etc/TZ:ro
      - /etc/localtime:/etc/localtime:ro
      - ${PATH_APPDATA}/qbittorrent-protonvpn/config:/config
      - ${PATH_MEDIA}:/mnt/media/downloads
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent-http.rule=Host('qbittorrent.<subdomain>.<domain>')
      - traefik.http.routers.qbittorrent-http.entrypoint=web
      - traefik.http.routers.qbittorrent-https.tls=true
      - traefik.http.routers.qbittorrent-https.tls.certresolver=cloudflare
      - traefik.http.routers.qbittorrent-https.entrypoint=websecure
      - traefik.http.routers.qbittorrent-https.rule=Host('qbittorrent.<subdomain>.<domain>')
    restart: unless-stopped
    depends_on:
      - qbittorrent-gluetun

  qbittorrent-gluetun:
    container_name: qbittorrent-gluetun
    image: docker.io/qmcgaw/gluetun:latest
    ports:
      - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}
    networks:
      - private-apps-qbittorrent-protonvpn
      - public-apps
    cap_add:
      - NET_ADMIN
    user: ${PUID:-0}:${PGID:-0}
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USERNAME}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
    volumes:
      - /etc/TZ:/etc/TZ:ro
      - /etc/localtime:/etc/localtime:ro
      - ./vpn:/gluetun
    labels:
      - "traefik.enable=${TRAEFIK_ENABLED:-false}"
      - "traefik.docker.network=public-apps"
      - "traefik.http.routers.qbittorrent-http.entrypoints=web"
      - "traefik.http.routers.qbittorrent-http.rule=Host(`qbittorrent.${TRAEFIK_CF_DNS_DOMAIN}`)"
      - "traefik.http.routers.qbittorrent-https.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent-https.rule=Host(`qbittorrent.${TRAEFIK_CF_DNS_DOMAIN}`)"
      - "traefik.http.routers.qbittorrent-https.tls=true"
      - "traefik.http.routers.nutqbittorrentify-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.qbittorrent-https.tls.domains[0].main=${TRAEFIK_CF_DNS_DOMAIN}"
      - "traefik.http.routers.qbittorrent-https.tls.domains[0].sans=*.${TRAEFIK_CF_DNS_DOMAIN}"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=5050"
    devices:
      - /dev/net/tun:/dev/net/tun

    restart: unless-stopped

networks:
  private-apps-qbittorrent-protonvpn:
    name: app-qbittorrent-protonvpn
    driver: bridge
  public-apps:
    external: true
