services:
  immich:
    container_name: immich
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    user: ${PUID:-0}:${PGID:-0}
    security_opt:
      - "no-new-privileges:true"
    ports:
      - '10150:2283'
    networks:
      - private-apps-immich
      - public-apps
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DB_HOSTNAME=immich-database
      - DB_DATABASE_NAME=${IMMICH_DATABASE_SCHEMA:-immich}
      - DB_USERNAME=${IMMICH_DATABASE_USERNAME:-immich}
      - DB_PASSWORD=${IMMICH_DATABASE_PASSWORD}
      - REDIS_HOSTNAME=immich-redis
      - CPU_CORES=${IMMICH_CPU_CORES:-4}
      #- IMMICH_TRUSTED_PROXIES=${IMMICH_TRUSTED_PROXIES}
      #- IMMICH_WORKERS_INCLUDE=${IMMICH_WORKERS_INCLUDE}
      #- IMMICH_WORKERS_EXCLUDE=${IMMICH_WORKERS_EXCLUDE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${PATH_APPDATA}/immich/data:/data
      - ${PATH_MEDIA}:/mnt/media/photos
    labels:
      - "traefik.enable=${TRAEFIK_ENABLED}"
      - "traefik.docker.network=public-apps"
      - "traefik.http.routers.immich-https.entrypoints=websecure"
      - "traefik.http.routers.immich-https.rule=Host(`immich.${TRAEFIK_CF_DNS_DOMAIN:-''}`)"
      - "traefik.http.routers.immich-https.service=immich"
      - "traefik.http.routers.immich-https.tls=true"
      - "traefik.http.routers.immich-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.immich-https.tls.domains[0].main=${TRAEFIK_CF_DNS_DOMAIN:-''}"
      - "traefik.http.routers.immich-https.tls.domains[0].sans=*.${TRAEFIK_CF_DNS_DOMAIN:-''}"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "traefik.http.services.immich.loadbalancer.server.scheme=http"
      - "homepage.name=Immich"
      - "homepage.group=Media"
      - "homepage.icon=https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/svg/immich.svg"
      - "homepage.href=https://immich.${TRAEFIK_CF_DNS_DOMAIN:-''}"
      - "homepage.description=Photo and video management"
    healthcheck:
      disable: false
    restart: unless-stopped
    depends_on:
      - immich-database
      - immich-redis

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    user: ${PUID:-0}:${PGID:-0}
    device_cgroup_rules:
      - 'c 189:* rmw'
    devices:
      - /dev/dri:/dev/dri
    networks:
      - private-apps-immich
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /dev/bus/usb:/dev/bus/usb
      - ${PATH_APPDATA}/immich/machine-learning/cache:/cache
    healthcheck:
      disable: false
    restart: unless-stopped

  immich-database:
    container_name: immich-database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    user: ${PUID:-0}:${PGID:-0}
    networks:
      - private-apps-immich
    environment:
      - POSTGRES_DB=${IMMICH_DATABASE_SCHEMA:-immich}
      - POSTGRES_USER=${IMMICH_DATABASE_USERNAME:-immich}
      - POSTGRES_PASSWORD=${IMMICH_DATABASE_PASSWORD}
      - POSTGRES_INITDB_ARGS='--data-checksums'
      - DB_STORAGE_TYPE=HDD
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${PATH_APPDATA}/immich/database:/var/lib/postgresql
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    user: ${PUID:-0}:${PGID:-0}
    networks:
      - private-apps-immich
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${PATH_APPDATA}/immich/redis:/data:rw
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

networks:
  private-apps-immich:
    name: private-apps-immich
    driver: bridge
  public-apps:
    external: true
