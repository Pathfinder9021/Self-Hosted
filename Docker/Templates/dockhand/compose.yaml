services:
  dockhand:
    container_name: dockhand
    image: fnsys/dockhand:${DOCKHAND_VERSION:-latest}
    ports:
      - 3000:3000
    networks:
      - public-apps
    environment:
      - DISABLE_LOCAL_LOGIN=${DOCKHAND_DISABLE_LOCAL_LOGIN:-False}
      - DISABLE_WHATS_NEW=${DOCKHAND_DISABLE_WHATS_NEW:-True}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PATH_APPDATA:-/volume1/Docker/AppData}/dockhand:/app/data:rw
    labels:
      - "traefik.enable=${TRAEFIK_ENABLED}"
      - "traefik.docker.network=public-apps"
      - "traefik.http.routers.dockhand-https.entrypoints=websecure"
      - "traefik.http.routers.dockhand-https.rule=Host(`dockhand.${TRAEFIK_CF_DNS_DOMAIN:-''}`)"
      - "traefik.http.routers.dockhand-https.service=dockhand"
      - "traefik.http.routers.dockhand-https.tls=true"
      - "traefik.http.routers.dockhand-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.dockhand-https.tls.domains[0].main=${TRAEFIK_CF_DNS_DOMAIN:-''}"
      - "traefik.http.routers.dockhand-https.tls.domains[0].sans=*.${TRAEFIK_CF_DNS_DOMAIN:-''}"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"
      - "traefik.http.services.dockhand.loadbalancer.server.scheme=http"
      - "homepage.name=Dockhand"
      - "homepage.group=DevOps"
      - "homepage.icon=https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/svg/dockhand-svg.svg"
      - "homepage.href=https://dockhand.${TRAEFIK_CF_DNS_DOMAIN:-''}"
      - "homepage.description=Docker container management"
    restart: unless-stopped

networks:
  public-apps:
    external: true
